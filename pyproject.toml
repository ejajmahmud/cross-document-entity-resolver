[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-document-entity-resolver"
version = "0.1.0"
description = "Graph entity linking component deduplicating coreference entities and resolving aliases across disparate unstructured knowledge bases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
cross-document-entity-resolver = "cross_document_entity_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cross_document_entity_resolver*"]
